name: Salesforce CI

on:
  pull_request:
    paths:
      - "packages/**"
      - "config/**"

env:
  SF_USE_GENERIC_UNIX_KEYCHAIN: true
  SF_CLI_TELEMETRY_OUTPUT: true
  SF_CONTENT_TYPE: JSON
  SF_CONTAINER_MODE: true
  DEVHUB_SFDX_URL: ${{ secrets.DEVHUB_SFDX_URL }}

jobs:
  analyze:
    name: Static Analysis
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install NPM Dependencies
        run: npm ci

      - name: Install Salesforce CLI
        run: npm install --global @salesforce/cli

      - name: Install Code Analyzer
        run: sf plugins install code-analyzer

      - name: Run Code Analyzer (PMD)
        run: sf code-analyzer run --severity-threshold 3

      - name: Check Apex Formatting
        run: npm run prettier:verify

      - name: Run ESLint
        if: hashFiles('**/lwc/**') != ''
        run: npm run lint

  detect-packages:
    name: Detect Changed Packages
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Detect package changes
        id: set-matrix
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
            HEAD="${{ github.event.pull_request.head.sha }}"
          else
            BASE="${{ github.event.before }}"
            HEAD="${{ github.sha }}"
          fi

          echo "Diffing $BASE..$HEAD"

          CHANGED=$(git diff --name-only "$BASE" "$HEAD" \
            | grep '^packages/' \
            | cut -d/ -f2 \
            | sort -u)

          if [ -z "$CHANGED" ]; then
            echo "matrix=[]" >> $GITHUB_OUTPUT
          else
            JSON=$(printf '%s\n' "$CHANGED" | jq -R . | jq -cs .)
            echo "matrix=$JSON" >> $GITHUB_OUTPUT
          fi

  build-test:
    name: Build & Test
    runs-on: ubuntu-latest
    needs: [analyze, detect-packages]

    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJson(needs.detect-packages.outputs.matrix) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Salesforce CLI
        run: npm install --global @salesforce/cli

      - name: Authenticate to Dev Hub
        run: |
          echo "${{ env.DEVHUB_SFDX_URL }}" | sf org login sfdx-url --set-default-dev-hub --sfdx-url-stdin

      - name: Create Scratch Org
        id: create_scratch
        run: |
          sf org create scratch --definition-file config/project-scratch-def.json --duration-days 1 --set-default
          echo "created=true" >> $GITHUB_OUTPUT

      - name: Deploy Project to Scratch Org
        run: sf project deploy start

      - name: Run Tests
        run: sf apex test run --result-format human --code-coverage

      - name: Delete Scratch Org
        if: always() && steps.create_scratch.outputs.created == 'true'
        run: sf org delete scratch --no-prompt
